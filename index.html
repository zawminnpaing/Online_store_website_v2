<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Luxe | Editorial Catalog</title>
    <meta name="description" content="Elevate your everyday style with our latest high-end collection.">
    <meta property="og:title" content="Luxe Fashion Store">
    <meta property="og:type" content="website">

    <!-- New Editorial Fonts: Cormorant Garamond & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <div class="logo" onclick="closeCart()">LUXE.</div>
            <div class="nav-icons">
                <i class="fas fa-search" onclick="toggleSearch()"></i>
                <div class="cart-icon-wrapper" onclick="openCart()">
                    <i class="fas fa-shopping-bag"></i>
                    <span class="cart-count" id="cart-count-badge">0</span>
                </div>
            </div>
        </div>
    </nav>

    <div class="search-bar-container" id="search-bar" style="display: none;">
        <input type="text" id="search-input" onkeyup="searchProducts()" placeholder="Search for products...">
        <i class="fas fa-times" onclick="toggleSearch()"></i>
    </div>

    <!-- === CATALOG VIEW === -->
    <div id="catalog-view">
        <header class="hero" id="main-hero">
            <div class="hero-content">
                <h1>The Earth Collection</h1>
                <p>Curated essentials for the modern wardrobe.</p>
            </div>
        </header>
        
        <main class="store-container">
            <div class="filter-bar" id="filter-bar">
                <button class="filter-btn active" onclick="filterProducts('All')">All</button>
                <button class="filter-btn" onclick="filterProducts('Outerwear')">Outerwear</button>
                <button class="filter-btn" onclick="filterProducts('Tops')">Tops</button>
                <button class="filter-btn" onclick="filterProducts('Bottoms')">Bottoms</button>
                <button class="filter-btn" onclick="filterProducts('Accessories')">Accessories</button>
            </div>
            
            <!-- Products inject here (Inline Expansion enabled) -->
            <div class="product-grid" id="product-grid"></div>

            <div id="home-extra-sections">
                <div class="related-section">
                    <h2>Newly Arrived</h2>
                    <div class="product-grid" id="new-arrivals-grid"></div>
                </div>
                <div class="related-section">
                    <h2>Trending Now</h2>
                    <div class="product-grid" id="trending-grid"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- === CART & CHECKOUT VIEW === -->
    <!-- Kept separate because checkout requires focus -->
    <div id="cart-view" style="display: none;">
        <main class="detail-container">
            <button class="back-btn" onclick="closeCart()">
                <i class="fas fa-arrow-left"></i> Continue Shopping
            </button>

            <div class="cart-layout">
                <div class="cart-items-section">
                    <h2>Your Bag</h2>
                    <div id="cart-items-container"></div>
                    <div class="cart-total">
                        <span>Total:</span>
                        <span id="cart-total-price">$0.00</span>
                    </div>
                </div>

                <div class="checkout-section">
                    <h2>Checkout Details</h2>
                    <form id="checkout-form">
                        <div class="form-group"><label>Full Name</label><input type="text" id="cust-name" required></div>
                        <div class="form-group"><label>Contact Number</label><input type="tel" id="cust-phone" required></div>
                        <div class="form-group"><label>Delivery Location</label><textarea id="cust-address" rows="3" required></textarea></div>
                    </form>

                    <div class="checkout-actions">
                        <p class="action-title">Place Order Via:</p>
                        <button class="checkout-btn telegram-btn" type="button" onclick="processCheckout('telegram')"><i class="fab fa-telegram-plane"></i> Send to Telegram</button>
                        <button class="checkout-btn viber-btn" type="button" onclick="processCheckout('viber')"><i class="fab fa-viber"></i> Send to Viber</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Infinite Image Carousel -->
    <div class="model-carousel" id="model-carousel-container">
        <div class="model-track" id="model-track"></div>
    </div>

    <footer class="store-footer">
        <div class="footer-grid">
            <div class="footer-brand">
                <h2>LUXE.</h2>
                <p>Curated fashion for the modern aesthetic.</p>
            </div>
        </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
